smtp_users:
  - 'nagios-notifications'
install_packages:
  - 'postfix'
  - 'opendkim'
  - 'postfix-policyd-spf-python'
  - 'opendmarc'
  - 'dovecot-imapd'
user_groups:                    "{{ smtp_users }}"
users:                          "{{ smtp_users }}"
add_users_to_groups:
  - user:                       'opendkim'
    groups:
      - 'sslkey'
  - user:                       'postfix'
    groups:
      - 'opendkim'
      - 'opendmarc'
create_files:
  - owner:                      'root'
    group:                      'root'
    mode:                       '0755'
    state:                      'directory'
    path:                       '/etc/opendkim'
  # Allow the mail user to read and back up the root mail log.
  - owner:                      'root'
    group:                      'mail'
    mode:                       '0640'
    state:                      'touch'
    path:                       '/var/mail/root'
  - owner:                      'opendkim'
    group:                      'opendkim'
    mode:                       '0755'
    state:                      'directory'
    path:                       '/var/spool/postfix/opendkim'
  - owner:                      'opendmarc'
    group:                      'opendmarc'
    mode:                       '0755'
    state:                      'directory'
    path:                       '/var/spool/postfix/opendmarc'
install_files:
  # I would prefer to just use the same host keys used by SSL web services,
  # signed by my internal CA, but those are all 4096 bit, and DKIM should be
  # restricted to 2048 bits.
  - owner:                      'opendkim'
    group:                      'root'
    mode:                       '0400'
    src:                        "../../sensitive-ansible/roles/{{ role_name }}/files/dkim_keys/dkim_private.pem"
    dest:                       "/etc/ssl/private/{{ inventory_hostname }}.dkim.key"
  - owner:                      'root'
    group:                      'root'
    mode:                       '0644'
    src:                        'files/conf/master.cf'
    dest:                       '/etc/postfix/master.cf'
  - owner:                      'root'
    group:                      'root'
    mode:                       '0644'
    src:                        'files/conf/smtpd.conf'
    dest:                       '/etc/postfix/sasl/smtpd.conf'
  - owner:                      'root'
    group:                      'root'
    mode:                       '0644'
    src:                        'files/conf/header_modifications'
    dest:                       '/etc/postfix/header_modifications'
  - owner:                      'root'
    group:                      'root'
    mode:                       '0644'
    src:                        'files/conf/aliases'
    dest:                       '/etc/aliases'
  - owner:                      'root'
    group:                      'root'
    mode:                       '0755'
    src:                        'files/bin/restart-postfix.sh'
    dest:                       '/etc/letsencrypt/renewal-hooks/post/restart-postfix.sh'
commands:
  - command:                    /usr/bin/newaliases
template_files:
  - owner:                      'root'
    group:                      'root'
    mode:                       '0644'
    src:                        'templates/conf/main.cf.j2'
    dest:                       '/etc/postfix/main.cf'
  - owner:                      'root'
    group:                      'root'
    mode:                       '0644'
    src:                        'templates/conf/dovecot.conf.j2'
    dest:                       '/etc/dovecot/dovecot.conf'
  - owner:                      'root'
    group:                      'root'
    mode:                       '0644'
    src:                        'templates/conf/relay_clientcerts.j2'
    dest:                       '/etc/postfix/relay_clientcerts'
  - owner:                      'root'
    group:                      'root'
    mode:                       '0644'
    src:                        'templates/conf/opendkim.conf.j2'
    dest:                       '/etc/opendkim.conf'
  - owner:                      'root'
    group:                      'root'
    mode:                       '0644'
    src:                        'templates/conf/opendkim/keytable.j2'
    dest:                       '/etc/opendkim/keytable'
  - owner:                      'root'
    group:                      'root'
    mode:                       '0644'
    src:                        'templates/conf/opendkim/signingtable.j2'
    dest:                       '/etc/opendkim/signingtable'
  - owner:                      'root'
    group:                      'root'
    mode:                       '0644'
    src:                        'templates/conf/opendkim/internalhosts.j2'
    dest:                       '/etc/opendkim/internalhosts'
  - owner:                      'root'
    group:                      'root'
    mode:                       '0644'
    src:                        'templates/conf/opendmarc.conf.j2'
    dest:                       '/etc/opendmarc.conf'
shell_commands_ignore_change:
  - user:                       'root'
    chdir:                      '/'
    command:                    postmap /etc/postfix/relay_clientcerts
enable_services:
  - 'postfix'
  - 'opendkim'
  - 'opendmarc'
  - 'dovecot'
restart_services:               "{{ start_services }}"
start_services:                 "{{ enable_services }}"
